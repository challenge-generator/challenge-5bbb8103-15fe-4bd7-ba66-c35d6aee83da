openapi: 3.1.0
info:
  title: API de Gestión de Solicitudes de Crédito
  description: |-
    API para el registro, consulta y validación de solicitudes de crédito en una fintech.
    Incluye integración con servicios externos como buró de riesgos y motor antifraude.
  version: 1.0.0
  contact:
    name: Equipo de Integración Fintech
    email: integracion@fintech.com
servers:
  - url: https://api.fintech.com/v1
    description: Producción
  - url: https://sandbox.api.fintech.com/v1
    description: Sandbox para pruebas
paths:
  /solicitudes:
    post:
      summary: Registrar una nueva solicitud de crédito
      description: |-
        Registra una solicitud de crédito con los datos del solicitante y el monto solicitado.
        Valida que el solicitante no tenga solicitudes pendientes con el mismo ID.
      operationId: registrarSolicitud
      tags:
        - Solicitudes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCredito'
            examples:
              solicitudEjemplo:
                value:
                  idSolicitud: "a1b2c3d4-5678-90ef-ghij-klmnopqrstuv"
                  tipoDocumento: "CC"
                  numeroDocumento: "1234567890"
                  nombre: "Juan Pérez"
                  apellido: "Gómez"
                  email: "juan.perez@example.com"
                  telefono: "3001234567"
                  montoSolicitado: 5000000
                  plazoMeses: 24
                  ingresosMensuales: 3000000
                  empleoActual: "Empleado"
                  fechaSolicitud: "2023-10-15"
      responses:
        '201':
          description: Solicitud creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponse'
              examples:
                exito:
                  value:
                    idSolicitud: "a1b2c3d4-5678-90ef-ghij-klmnopqrstuv"
                    estado: "EN_PROCESO"
                    fechaCreacion: "2023-10-15T10:00:00Z"
        '400':
          description: Error de validación en los datos de entrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validacion:
                  value:
                    codigo: "VALIDACION_ERROR"
                    mensaje: "El campo 'montoSolicitado' debe ser mayor a 1,000,000 COP"
                    detalles:
                      - campo: "montoSolicitado"
                        error: "Debe ser mayor a 1,000,000 COP"
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicto - Solicitud ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                conflicto:
                  value:
                    codigo: "SOLICITUD_DUPLICADA"
                    mensaje: "Ya existe una solicitud con el mismo ID"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Consultar historial de solicitudes
      description: |-
        Retorna el historial de solicitudes de crédito para un solicitante, filtrando por estado si se especifica.
      operationId: consultarHistorial
      tags:
        - Solicitudes
      parameters:
        - name: numeroDocumento
          in: query
          description: Número de documento del solicitante
          required: true
          schema:
            type: string
            example: "1234567890"
        - name: estado
          in: query
          description: Estado de la solicitud (opcional)
          required: false
          schema:
            type: string
            enum: ["EN_PROCESO", "APROBADA", "RECHAZADA", "CANCELADA"]
      responses:
        '200':
          description: Historial de solicitudes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SolicitudResponse'
              examples:
                historial:
                  value:
                    - idSolicitud: "a1b2c3d4-5678-90ef-ghij-klmnopqrstuv"
                      estado: "APROBADA"
                      fechaCreacion: "2023-10-10T09:00:00Z"
                      montoAprobado: 4500000
                    - idSolicitud: "z9y8x7w6-5432-10uv-tsrq-ponmlkjihgfed"
                      estado: "RECHAZADA"
                      fechaCreacion: "2023-09-20T08:30:00Z"
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /solicitudes/{idSolicitud}:
    get:
      summary: Consultar detalle de una solicitud
      description: |-
        Retorna el detalle de una solicitud específica incluyendo su estado actual y validaciones realizadas.
      operationId: consultarSolicitud
      tags:
        - Solicitudes
      parameters:
        - name: idSolicitud
          in: path
          description: ID de la solicitud
          required: true
          schema:
            type: string
            format: uuid
            example: "a1b2c3d4-5678-90ef-ghij-klmnopqrstuv"
      responses:
        '200':
          description: Detalle de la solicitud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudDetalle'
              examples:
                detalle:
                  value:
                    idSolicitud: "a1b2c3d4-5678-90ef-ghij-klmnopqrstuv"
                    estado: "EN_PROCESO"
                    fechaCreacion: "2023-10-15T10:00:00Z"
                    tipoDocumento: "CC"
                    numeroDocumento: "1234567890"
                    nombre: "Juan Pérez"
                    apellido: "Gómez"
                    email: "juan.perez@example.com"
                    montoSolicitado: 5000000
                    plazoMeses: 24
                    ingresosMensuales: 3000000
                    validaciones:
                      - tipo: "ANTIFRAUDE"
                        estado: "APROBADO"
                        fecha: "2023-10-15T10:05:00Z"
                      - tipo: "BUREAU_RIESGO"
                        estado: "PENDIENTE"
                        fecha: null
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Solicitud no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                noEncontrado:
                  value:
                    codigo: "SOLICITUD_NO_ENCONTRADA"
                    mensaje: "No existe una solicitud con el ID proporcionado"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    SolicitudCredito:
      type: object
      required:
        - idSolicitud
        - tipoDocumento
        - numeroDocumento
        - nombre
        - apellido
        - email
        - telefono
        - montoSolicitado
        - plazoMeses
        - ingresosMensuales
        - empleoActual
      properties:
        idSolicitud:
          type: string
          format: uuid
          description: Identificador único de la solicitud
          example: "a1b2c3d4-5678-90ef-ghij-klmnopqrstuv"
        tipoDocumento:
          type: string
          enum: ["CC", "CE", "NIT", "PASAPORTE"]
          description: Tipo de documento de identidad
          example: "CC"
        numeroDocumento:
          type: string
          description: Número de documento de identidad
          example: "1234567890"
          pattern: "^[0-9]{6,15}$"
        nombre:
          type: string
          description: Nombre del solicitante
          example: "Juan"
          minLength: 2
          maxLength: 50
        apellido:
          type: string
          description: Apellido del solicitante
          example: "Pérez"
          minLength: 2
          maxLength: 50
        email:
          type: string
          format: email
          description: Correo electrónico del solicitante
          example: "juan.perez@example.com"
        telefono:
          type: string
          description: Número de teléfono del solicitante
          example: "3001234567"
          pattern: "^[0-9]{10,15}$"
        montoSolicitado:
          type: number
          description: Monto solicitado en COP
          example: 5000000
          minimum: 1000000
          maximum: 50000000
        plazoMeses:
          type: integer
          description: Plazo de pago en meses
          example: 24
          minimum: 6
          maximum: 72
        ingresosMensuales:
          type: number
          description: Ingresos mensuales del solicitante en COP
          example: 3000000
          minimum: 1000000
        empleoActual:
          type: string
          description: Situación laboral actual del solicitante
          example: "Empleado"
          enum: ["Empleado", "Independiente", "Pensionado", "Sin empleo"]
        fechaSolicitud:
          type: string
          format: date
          description: Fecha de la solicitud (opcional, si no se envía se usa la fecha actual)
          example: "2023-10-15"

    SolicitudResponse:
      type: object
      required:
        - idSolicitud
        - estado
        - fechaCreacion
      properties:
        idSolicitud:
          type: string
          format: uuid
          description: Identificador único de la solicitud
          example: "a1b2c3d4-5678-90ef-ghij-klmnopqrstuv"
        estado:
          type: string
          enum: ["EN_PROCESO", "APROBADA", "RECHAZADA", "CANCELADA"]
          description: Estado actual de la solicitud
          example: "EN_PROCESO"
        fechaCreacion:
          type: string
          format: date-time
          description: Fecha y hora de creación de la solicitud
          example: "2023-10-15T10:00:00Z"
        montoAprobado:
          type: number
          description: Monto aprobado en COP (solo para estado APROBADA)
          example: 4500000
          nullable: true

    SolicitudDetalle:
      allOf:
        - $ref: '#/components/schemas/SolicitudResponse'
        - type: object
          required:
            - tipoDocumento
            - numeroDocumento
            - nombre
            - apellido
            - email
            - montoSolicitado
            - plazoMeses
            - ingresosMensuales
            - validaciones
          properties:
            tipoDocumento:
              type: string
              enum: ["CC", "CE", "NIT", "PASAPORTE"]
              description: Tipo de documento de identidad
              example: "CC"
            numeroDocumento:
              type: string
              description: Número de documento de identidad
              example: "1234567890"
            nombre:
              type: string
              description: Nombre del solicitante
              example: "Juan"
            apellido:
              type: string
              description: Apellido del solicitante
              example: "Pérez"
            email:
              type: string
              format: email
              description: Correo electrónico del solicitante
              example: "juan.perez@example.com"
            montoSolicitado:
              type: number
              description: Monto solicitado en COP
              example: 5000000
            plazoMeses:
              type: integer
              description: Plazo de pago en meses
              example: 24
            ingresosMensuales:
              type: number
              description: Ingresos mensuales del solicitante en COP
              example: 3000000
            validaciones:
              type: array
              description: Validaciones realizadas sobre la solicitud
              items:
                type: object
                required:
                  - tipo
                  - estado
                properties:
                  tipo:
                    type: string
                    enum: ["ANTIFRAUDE", "BUREAU_RIESGO", "VERIFICACION_IDENTIDAD"]
                    description: Tipo de validación
                    example: "ANTIFRAUDE"
                  estado:
                    type: string
                    enum: ["PENDIENTE", "APROBADO", "RECHAZADO"]
                    description: Estado de la validación
                    example: "APROBADO"
                  fecha:
                    type: string
                    format: date-time
                    description: Fecha y hora de la validación (null si está pendiente)
                    example: "2023-10-15T10:05:00Z"
                    nullable: true

    ErrorResponse:
      type: object
      required:
        - codigo
        - mensaje
      properties:
        codigo:
          type: string
          description: Código de error
          example: "VALIDACION_ERROR"
        mensaje:
          type: string
          description: Mensaje descriptivo del error
          example: "El campo 'montoSolicitado' debe ser mayor a 1,000,000 COP"
        detalles:
          type: array
          description: Detalles adicionales del error (opcional)
          items:
            type: object
            properties:
              campo:
                type: string
                description: Nombre del campo con error
                example: "montoSolicitado"
              error:
                type: string
                description: Descripción del error
                example: "Debe ser mayor a 1,000,000 COP"